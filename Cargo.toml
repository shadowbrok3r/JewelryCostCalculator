[package]
name = "jewelry_cost_calculator"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
eframe = { version="0.36", features=["persistence", "serde",  "default_fonts", "glow", "x11"], default-features=false }
tokio = { version = "1", features = ["full", "tracing"] }
surrealdb = { version = "3.3.0", default-features = false, features = ["protocol-ws", "rustls"] }
surrealdb-types = { version = "3.3.0" }
jewelry_shared = { path = "../jewelry_shared", features = ["surreal"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
dotenvy = "0.15.7"
egui_glow = "0.36"
reqwest = { version = "0.13.5", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17.2"
nalgebra = "0.35.0"
egui_logger = "0.12"
log = "0.4"
anyhow = "1.0"
byteorder = "1.5.0"
clap = { version = "4", features = ["derive"] }
regex = "1"
colored = "3.1.1"
num-format = "0.4.4"
rayon = "1.12.0"
smallvec = "1.16"
puffin = "0.20.0"
puffin_http = "0.17.0"
parking_lot = "0.12"

[build-dependencies]
dotenvy = "0.15.7"

[dependencies.egui]
version = "0.36"
default-features = false
features = ["rayon", "bytemuck"]
